name: CI Pull Request

on:
  pull_request:
    branches: [main, dev]
      
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
      NEXTAUTH_SECRET: "dummy_secret_for_ci_only"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"

    steps:
      - name: Checkout du code source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Installation des dependances
        run: npm ci

      - name: Generation du client Prisma
        run: npx prisma generate

      - name: Cache Next.js
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.[jt]s', '**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Verification du code (Lint)
        run: npm run lint || true

      - name: Verification des types (TypeScript)
        run: npx tsc --noEmit
        
      - name: Execution des tests (Vitest)
        run: npm run test

      - name: Build test (sans export)
        run: npm run build
