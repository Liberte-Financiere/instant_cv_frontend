name: CI Pull Request

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'frontend/instant_cv/**'
      
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./frontend/instant_cv

    steps:
      - name: Checkout du code source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './frontend/instant_cv/package-lock.json'

      - name: Installation des dependances
        run: npm ci

      - name: Generation du client Prisma
        run: npx prisma generate

      - name: Cache Next.js
        uses: actions/cache@v4
        with:
          path: |
            frontend/instant_cv/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('frontend/instant_cv/package-lock.json') }}-${{ hashFiles('frontend/instant_cv/**/*.[jt]s', 'frontend/instant_cv/**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('frontend/instant_cv/package-lock.json') }}-

      - name: Verification du code (Lint)
        run: npm run lint

      - name: Verification des types (TypeScript)
        run: npx tsc --noEmit
        
      - name: Execution des tests (Vitest)
        run: npm run test

      - name: Build test (sans export)
        run: npm run build
