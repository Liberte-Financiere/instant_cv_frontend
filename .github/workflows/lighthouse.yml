name: Lighthouse CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main]

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./frontend/instant_cv

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './frontend/instant_cv/package-lock.json'

      - name: Installation
        run: npm ci

      - name: Cache Next.js
        uses: actions/cache@v4
        with:
          path: |
            frontend/instant_cv/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('frontend/instant_cv/package-lock.json') }}-${{ hashFiles('frontend/instant_cv/**/*.[jt]s', 'frontend/instant_cv/**/*.[jt]sx') }}

      - name: Generation Prisma
        run: npx prisma generate

      - name: Build
        run: npm run build
        
      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli@0.13.x
          # Demarre le serveur en background et lance Lighthouse sur le port par defaut de Next.js
          lhci autorun --collect.startServerCommand="npm run start" --collect.url="http://localhost:3000/" --upload.target="temporary-public-storage"
