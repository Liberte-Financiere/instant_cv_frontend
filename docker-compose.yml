services:
  bg-removal:
    build:
      context: ./microservices/bg_removal
    container_name: jobsira-bg-removal
    ports:
      - "127.0.0.1:3001:3001"
    restart: unless-stopped

  email-worker:
    build:
      context: ./microservices/email_service
    container_name: jobsira-email-worker
    ports:
      - "127.0.0.1:3002:3002"
    env_file:
      - .env
    restart: unless-stopped

  cron-worker:
    build:
      context: ./microservices/cron_service
    container_name: jobsira-cron-worker
    network_mode: "host"
    env_file:
      - .env
    restart: unless-stopped

  jobs-api:
    build:
      context: ./microservices/jobs_api
    container_name: jobsira-jobs-api
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
